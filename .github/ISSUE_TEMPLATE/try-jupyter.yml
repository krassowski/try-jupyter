name: Try Jupyter site or example notebooks
description: An example notebook or the Try Jupyter site is wrong, or you are not sure which part is broken.
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page where it happened.
      placeholder: https://jupyter.org/try-jupyter/lab/index.html
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 150
